[project]
name = "export-stars"
version = "0.1.0"
description = "Export the URLs and descriptions of repositories you've starred on GitHub"
readme = "README.md"
authors = [
    { name = "Jeff C", email = "pub@jeffc.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "pygithub>=1.43.4,<2",
    "urllib3",
]

[project.scripts]
export-stars = "export_stars.export_stars:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "ipython>=9.18.1",
]
